function makePlanet(cat,r){
 const S=(Math.ceil(r*3.4)|1)+2,m=S>>1;
 const cv=document.createElement('canvas');cv.width=cv.height=S;
 const g=cv.getContext('2d'),im=g.createImageData(S,S),d=im.data;
 const pal=cat.pal.map(hx),out=hx(cat.out),acc=hx(cat.feat||cat.acc);
 const Lx=-.5,Ly=-.6,Lz=.62,Ll=Math.hypot(Lx,Ly,Lz);
 const put=(x,y,c)=>{const i=(y*S+x)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255};
 const blobs=[[-.35,-.15,.26,'#ffd24d'],[.28,.3,.22,'#38e1ff'],[.3,-.45,.16,'#ffffff'],[-.1,.5,.14,'#9b7bff']].map(b=>[b[0]*r,b[1]*r,b[2]*r,hx(b[3])]);
 const rc=cat.ring?cat.ring.map(hx):null,cs=Math.cos(-.38),sn=Math.sin(-.38);
 for(let y=0;y<S;y++)for(let x=0;x<S;x++){
  const dx=x-m,dy=y-m,d2=dx*dx+dy*dy,inP=d2<=r*r;

   if(e<=1&&e>=.5&&(!inP||v>0)){put(x,y,e<.7?rc[0]:e<.88?rc[1]:rc[0]);continue}}

   case'design':for(const b of blobs)if((dx-b[0])**2+(dy-b[1])**2<b[2]**2)ac=b[3];break;
   case'product':if(((dx+dy+4*r)>>2)%4===0)bias=.7;break;
   case'marketing':if(((dy+r)/3|0)%3===0)bias=-.6;break;

   case'strategy':{const q=Math.PI/6,lat=Math.asin(dy/r),w=Math.sqrt(Math.max(1e-6,r*r-dy*dy)),lon=Math.asin(cl(dx/w,-1,1));const a=Math.abs(lat%q),b=Math.abs(lon%q);if(Math.min(a,q-a)<.06||Math.min(b,q-b)<.06)bias=1;break}

 }

}
